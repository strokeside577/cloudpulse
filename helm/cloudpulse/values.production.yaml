# Production-ready Helm values for CloudPulse
# Use with: helm upgrade --install cloudpulse ./helm/cloudpulse -f values.production.yaml

replicaCount: 3

image:
  repository: us-central1-docker.pkg.dev/YOUR-PROJECT-ID/cloudpulse/cloudpulse
  tag: v1.0.0  # Replace with actual version tag
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloudpulse
          topologyKey: kubernetes.io/hostname

config:
  logLevel: info
  environment: production

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

