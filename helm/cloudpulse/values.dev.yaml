# Development-ready Helm values for CloudPulse
# Use with: helm upgrade --install cloudpulse ./helm/cloudpulse -f values.dev.yaml

replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/YOUR-PROJECT-ID/cloudpulse/cloudpulse
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 256m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  logLevel: debug
  environment: development

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s